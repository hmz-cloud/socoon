<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Socoon — Projects Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .thumb{cursor:pointer;transition:transform .2s}
    .thumb:hover{transform:scale(1.03)}
    .lb{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.85);z-index:60;padding:1rem}
    .lb img{max-width:calc(100% - 4rem);max-height:calc(100% - 4rem);}
    .lb-close{position:absolute;top:1rem;right:1rem;color:#fff;font-size:1.5rem;cursor:pointer}
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <header class="py-6 bg-white shadow-sm">
    <div class="max-w-6xl mx-auto px-4">
      <a href="/" class="font-bold text-lg">Socoon</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4">
    <h1 class="text-2xl font-extrabold mb-3">Projects Gallery</h1>
    <p class="text-slate-600 mb-6">All products and solutions. Click thumbnails to enlarge.</p>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <figure>
        <img src="/ZIPS%E2%84%A2%20System.jpeg" alt="ZIPS System" class="thumb w-full h-48 object-cover rounded-lg" data-full="/ZIPS%E2%84%A2%20System.jpeg">
        <figcaption class="mt-2 text-sm font-semibold">ZIPS™ System</figcaption>
      </figure>

      <figure>
        <img src="/SOUNDLINE%20DB%E2%84%A2.jpeg" alt="SOUNDLINE DB" class="thumb w-full h-48 object-cover rounded-lg" data-full="/SOUNDLINE%20DB%E2%84%A2.jpeg">
        <figcaption class="mt-2 text-sm font-semibold">SOUNDLINE DB™</figcaption>
      </figure>

      <figure>
        <img src="/ShumoPlast.jpeg" alt="ShumoPlast" class="thumb w-full h-48 object-cover rounded-lg" data-full="/ShumoPlast.jpeg">
        <figcaption class="mt-2 text-sm font-semibold">SHUMOPLAST™</figcaption>
      </figure>

      <figure>
        <img src="/Acoustic%20Group%20logo.webp" alt="Acoustic Group" class="thumb w-full h-48 object-cover rounded-lg" data-full="/Acoustic%20Group%20logo.webp">
        <figcaption class="mt-2 text-sm font-semibold">Acoustic Group</figcaption>
      </figure>

      <figure>
        <img src="/Socoon%20logo%20Dark.svg" alt="Socoon Logo Dark" class="thumb w-full h-48 object-contain rounded-lg bg-white p-4" data-full="/Socoon%20logo%20Dark.svg">
        <figcaption class="mt-2 text-sm font-semibold">Socoon — Brand</figcaption>
      </figure>

    </div>
  </main>

  <script>
    document.querySelectorAll('.thumb').forEach(img=>{
      img.addEventListener('click', ()=>{
        const src=img.dataset.full;
        const lb=document.createElement('div');lb.className='lb';
        lb.innerHTML='<span class="lb-close">✕</span><img src="'+src+'" alt="">';
        document.body.appendChild(lb);
        lb.querySelector('.lb-close').addEventListener('click', ()=>lb.remove());
        lb.addEventListener('click', e=>{ if(e.target===lb) lb.remove(); });
      });
    });
  </script>
</body>
</html>
